name: Feature request
description: Suggest something new, or an improvement to something that exists
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Which part of the project
      options:
        - Dictionary / search
        - Reader
        - Converter / IME
        - Camera OCR
        - Flashcards / learning
        - System keyboard (iOS or Android)
        - Chrome extension
        - RIME schema
        - Stroke order editor
        - Character data
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation you run into, not just the feature you have in mind. It often turns out there's a better fix than the one first imagined.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today
      description: Optional. Including other apps, dictionaries or websites that do this well.
